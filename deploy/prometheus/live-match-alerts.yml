# Alert rules for the live match tracking SLOs (docs/fpl-bot-slo.md): 95% of score
# updates within 60 seconds, 99.5% of match-minutes available. Both metrics only get
# data while a match is actually live, so these naturally only fire mid-match — no
# separate "is a match on" guard is needed. Defined alongside the feature now; not yet
# deployed to a live Prometheus/Alertmanager instance until the Phase 6 infra work.
#
# Bot-down entirely is already covered by the FplBotDown alert in
# deadline-reminders-alerts.yml — not duplicated here.
groups:
  - name: live-match-tracking
    rules:
      - alert: LiveMatchUpdateFreshnessBreached
        # Fraction of updates over the 60s SLA bucket boundary, over a 5m window.
        expr: >-
          (
            increase(bot_live_match_update_freshness_seconds_count[5m])
            -
            increase(bot_live_match_update_freshness_seconds_bucket{le="60"}[5m])
          )
          /
          increase(bot_live_match_update_freshness_seconds_count[5m])
          > 0.05
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Live score updates are landing slower than 60s"
          description: >-
            More than 5% of live match score updates over the last 5 minutes took longer
            than 60 seconds to send, breaching the freshness SLO.

      - alert: LiveMatchAvailabilityBreached
        expr: >-
          increase(bot_live_match_poll_result_total{result="failure"}[5m])
          /
          (
            increase(bot_live_match_poll_result_total{result="success"}[5m])
            +
            increase(bot_live_match_poll_result_total{result="failure"}[5m])
          )
          > 0.005
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Live match polling failure rate exceeds the availability budget"
          description: >-
            More than 0.5% of live match poll cycles have failed over the last 5
            minutes — the ~27-second-per-90-minutes error budget for match-minute
            availability. This is a proxy on poll-cycle success, not a literal
            match-minutes calculation; that needs cross-referencing the actual match
            schedule in Grafana.
